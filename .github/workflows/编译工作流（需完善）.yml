name: Build NRadio N3000

on:
  workflow_dispatch: # 允许在网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android /opt/ghc
        sudo -E apt-get -y update
        sudo -E apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo timedatectl set-timezone "Asia/Shanghai"



    - name: Inject DTS and MK files
      run: |
        cd openwrt
        
        # 1. 拷贝 DTS 文件到源码树
        cp ../dts/*.dts ../dts/*.dtsi target/linux/mediatek/dts/
        
        # 2. 向 filogic.mk 注入你的设备定义
        cat >> target/linux/mediatek/image/filogic.mk << 'EOF'
        
        define Device/nradio_n3000
          DEVICE_VENDOR := NRadio
          DEVICE_MODEL := N3000
          DEVICE_DTS := mt7981-nradio-wt9138
          DEVICE_DTS_DIR := ../dts
          SUPPORTED_DEVICES := NRadio-N3000-emmc nradio,n3000
          DEVICE_PACKAGES := \
            kmod-usb3 kmod-usb-net-rndis kmod-usb-net-cdc-ether \
            kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware \
            kmod-phy-maxlinear automount
          IMAGE_SIZE := 262144k
          IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata | check-size
        endef
        TARGET_DEVICES += nradio_n3000
        EOF

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom config
      run: |
        cd openwrt
        # 拷贝你的配置文件并重命名为 .config
        cp ../config/nradio_n3000.config .config
        # 让系统自动计算依赖，补全未选中的默认项
        make defconfig

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      run: |
        cd openwrt
        echo "开始编译，使用 $(nproc) 线程..."
        # 第一次用多线程，失败则降级单线程重试一次看详细报错
        make -j$(nproc) V=s || make -j1 V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: NRadio-N3000-Firmware
        path: openwrt/bin/targets/mediatek/filogic/*.bin
        retention-days: 7
